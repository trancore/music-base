name: Flutter Windows

on:
  pull_request:
    paths:
      - '.github/workflows/flutter-windows.yml'
      - 'android/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'test/**'
      - 'windows/**'
      - 'macos/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/flutter-windows.yml'
      - 'android/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'test/**'
      - 'windows/**'
      - 'macos/**'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Windows app
        run: flutter build windows
